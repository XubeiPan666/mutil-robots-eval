name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test dependencies
        run: python -m pip install 'numpy==1.26.4' 'requests>=2.31,<3'
      - name: Check release sources
        run: python scripts/check_release.py
      - name: Test launcher
        run: python -m unittest discover -s tests -v
      - name: Test progress metrics
        env:
          PYTHONPATH: RoboFactory
        run: python -m unittest discover -s RoboFactory/script/MACG/eval_common/tests -v
      - name: Test per-arm proxy
        env:
          PYTHONPATH: RoboFactory/script/MACG/eval_scripts_rule_base_peram
        run: python -m unittest discover -s RoboFactory/script/MACG/eval_scripts_rule_base_peram -p 'test_*.py' -v
