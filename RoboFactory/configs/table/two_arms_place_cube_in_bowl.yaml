# configuration for TwoArmsCubeInBowl task
# agent1 (right, y=0.4) picks bowl from right side and places it at center (tray)
# agent0 (left, y=-0.4) picks cube from left side and places it inside the bowl
task_name: TwoArmsCubeInBowl
scene:
  name: Table
  primitives:
    - name: cubeA
      builder: mani_skill.utils.building.actors.build_cube
      params:
        half_size: 0.02
        color: [0.04705882, 0.16470588, 0.62745098, 1.]
        name: cubeA
        initial_pose:
          p: [0.4, -0.5, 0.02]
      pos:
        ppos:
          p: [0.4, -0.5, 0.02]
        qpos: [1., 0., 0., 0.]
        randp_scale: [0.05, 0.05, 0.]
        randq_scale: [0., 0., 0., 0.]
        random_quaternions: [1, 1, 0]

  assets:
    - name: table
      file_path: assets/scenes/table/table.glb
      collision:
        type: box
        pos:
          p: [0, 0, 0.45982145]
          half_size: [3.0225, 1.51125, 0.45982145]
      pos:
        ppos:
          p: [-0.12, 0., -0.9196429]
          q: [0., 0., 1.5707963268]
        randp_scale: [0., 0., 0.]
        randq_scale: [0., 0., 0., 0.]
      scale: [4.375, 4.375, 1.75]
  env:
    floor_width: 100

objects:
  -
    name: bowl
    file_path: release/perturbation_assets_v1/perturbation_assets_v1/distractors/002_bowl/visual/base3.glb
    annotation_path: release/perturbation_assets_v1/perturbation_assets_v1/distractors/002_bowl/model_data3.json
    material:
      type: sapien.pysapien.physx.PhysxMaterial
      params:
        static_friction: 0.3
        dynamic_friction: 0.3
        restitution: 0.
    visual:
      filename: release/perturbation_assets_v1/perturbation_assets_v1/distractors/002_bowl/visual/base3.glb
      scale: [0.05, 0.05, 0.05]
    collision:
      type: multiple_convex
      filename: release/perturbation_assets_v1/perturbation_assets_v1/distractors/002_bowl/collision/base3.glb
      scale: [0.05, 0.05, 0.05]
    pos:
      ppos:
        p: [0.4, 0.6, 0.]
      qpos: [0.5, 0.5, 0.5, 0.5]
      randp_scale: [0.2, -0.2, 0.]
      randq_scale: [0., 0., 0., 0.]

  -
    name: tray
    file_path: release/perturbation_assets_v1/perturbation_assets_v1/distractors/008_tray/visual/base0.glb
    annotation_path: release/perturbation_assets_v1/perturbation_assets_v1/distractors/008_tray/model_data0.json
    material:
      type: sapien.pysapien.physx.PhysxMaterial
      params:
        static_friction: 0.5
        dynamic_friction: 0.5
        restitution: 0.
    visual:
      filename: release/perturbation_assets_v1/perturbation_assets_v1/distractors/008_tray/visual/base0.glb
      scale: [0.16, 0.16, 0.16]
    collision:
      type: multiple_convex
      filename: release/perturbation_assets_v1/perturbation_assets_v1/distractors/008_tray/collision/base0.glb
      scale: [0.16, 0.16, 0.16]
    body_type: static
    pos:
      ppos:
        p: [0.3, 0., 0.]
      qpos: [0.5, 0.5, 0.5, 0.5]
      randq_scale: [0., 0., 0., 0.]


agents:
  -
    robot_uid: panda-0
    pos:
      ppos:
        p: [-0.2, -0.4, 0.]
        q: [0., 0., 0.]
      qpos: [0., 0.3926990817, 0., -1.9634954085, 0., 2.3561944902, 0.7853981634, 0.04, 0.04]
      randp_scale: [0., 0., 0.]
      randq_scale: [0., 0., 0., 0., 0., 0., 0., 0., 0.]
  -
    robot_uid: panda-1
    pos:
      ppos:
        p: [-0.2, 0.4, 0.]
        q: [0., 0., 0.]
      qpos: [0., 0.3926990817, 0., -1.9634954085, 0., 2.3561944902, 0.7853981634, 0.04, 0.04]
      randp_scale: [0., 0., 0.]
      randq_scale: [0., 0., 0., 0., 0., 0., 0., 0., 0.]

cameras:
  sensor:
    -
      uid: wrist_camera_agent0
      pose:
        type: pose
        params: [[0.05, 0.0, -0.06], [0.0, 0.675590, 0.0, 0.737277]]
      width: 224
      height: 224
      fov: 2.0943951024
      near: 0.01
      far: 10
    -
      uid: wrist_camera_agent1
      pose:
        type: pose
        params: [[0.05, 0.0, -0.06], [0.0, 0.675590, 0.0, 0.737277]]
      width: 224
      height: 224
      fov: 2.0943951024
      near: 0.01
      far: 10
    -
      uid: head_camera_global
      pose:
        type: look_at
        params: [[0., 0.0, 0.5], [0.5, 0.0, 0.1]]
      width: 224
      height: 224
      fov: 2.0943951024
      near: 0.01
      far: 10

  human_render:
    -
      uid: render_camera
      pose:
        type: look_at
        params: [[0.6, 0.7, 0.6], [0.0, 0.0, 0.35]]
      width: 1024
      height: 1024
      fov: 1
      near: 0.01
      far: 100
