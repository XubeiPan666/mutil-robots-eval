  assets: 
    - name: table
      file_path: assets/scenes/table/table.glb
      collision:
        type: box
        pos:
          p: [0, 0, 0.45982145]
          half_size: [3.0225, 1.51125, 0.45982145]
      pos: 
        ppos:
          p: [-0.12, 0., -0.9196429]
          q: [0., 0., 1.5707963268]
        randp_scale: [0., 0., 0.]
        randq_scale: [0., 0., 0., 0.]
      scale: [4.375, 4.375, 1.75]
  env:
    floor_width: 100
    
objects:
  - 
    name: meat
    file_path: assets/objects/meat_annotated/textured.obj
    annotation_path: assets/objects/meat_annotated/model_data.json
    material: 
      type: sapien.pysapien.physx.PhysxMaterial
      params:
        static_friction: 0.3
        dynamic_friction: 0.3
        restitution: 0.
    visual:
      filename: assets/objects/meat_annotated/textured.obj
      scale: [0.08, 0.4, 0.08]
    collision:
      type: convex
      filename: assets/objects/meat_annotated/textured.obj
      scale: [0.08, 0.4, 0.08]
    pos:
      ppos:
        # p: [0.6, -0.2, 0.]
        p: [0.4, -0.4, 0.]
      qpos: [0.996, 0.055, -0.062, 0.036]
      randp_scale: [0.2, 0.2, 0.]
      randq_scale: [0., 0., 0., 0.]
    mass_params:
      mass: 0.005
      cmass_local_pose: [0., 0., 0.]
      inertia: [0.1, 0.1, 0.1]

  
  - 
    name: basket
    file_path: release/perturbation_assets_v1/perturbation_assets_v1/distractors/110_basket/visual/base0.glb
    annotation_path: release/perturbation_assets_v1/perturbation_assets_v1/distractors/110_basket/model_data0.json
    material: 
      type: sapien.pysapien.physx.PhysxMaterial
      params:
        static_friction: 0.3
        dynamic_friction: 0.3
        restitution: 0.
    visual:
      filename: release/perturbation_assets_v1/perturbation_assets_v1/distractors/110_basket/visual/base0.glb
      scale: [0.12, 0.12, 0.12]
    collision:
      type: multiple_convex
      filename: release/perturbation_assets_v1/perturbation_assets_v1/distractors/110_basket/collision/base0.glb
      scale: [0.12, 0.12, 0.12]
    pos:
      ppos:
  
        
        # p: [0.4, 0.2, 0.]
        p: [0.3, 0.1, 0.]
        
      # qpos: [0.5, 0.5, 0.5, 0.5]
      qpos: [0.055, 0.058, 0.705, 0.705]
      randp_scale: [0.1, 0.1, 0.]
      randq_scale: [0., 0., 0., 0.]
    mass_params:
      mass: 0.05
      cmass_local_pose: [0., 0., 0.]
      inertia: [0.1, 0.1, 0.1]


