        q: [0., 0., 0]
      qpos: [0., 0., 0., -2.7, 0., 2.8, 0.7853981634, 0.04, 0.04]
      randp_scale: [0., 0., 0.]
      randq_scale: [0., 0., 0., 0., 0., 0., 0., 0., 0.]

