  -
    robot_uid: panda-0
    pos:
      ppos:
        p: [-0.6, -0.4, 0.]
        q: [0., 0., 0]
      # qpos: [0., 0.3926990817, 0., -1.9634954085, 0., 2.3561944902, 0.7853981634, 0.04, 0.04]
      qpos: [0., 0., 0., -2.7, 0., 2.8, 0.7853981634, 0.04, 0.04]
      randp_scale: [0., 0., 0.]
      randq_scale: [0., 0., 0., 0., 0., 0., 0., 0., 0.]
  -
    robot_uid: panda-1
    pos:
      ppos:
        p: [0.55, 0., 0.]
        q: [0., 0., 3.1415926536]
      qpos: [0., 0., 0., -2.7, 0., 2.8, 0.7853981634, 0.04, 0.04]
      randp_scale: [0., 0., 0.]
      randq_scale: [0., 0., 0., 0., 0., 0., 0., 0., 0.]
  -
