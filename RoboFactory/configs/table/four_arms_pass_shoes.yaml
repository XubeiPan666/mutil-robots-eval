# configuration for objects and agents, add scene as well
task_name: FourArmsPassShoes
scene:
  name: Table
  env:
    floor_width: 100
  primitives:
    - name: goal_region
      builder: mani_skill.utils.building.actors.build_red_white_target
      params:
        radius: 0.2
        thickness: 0.00005  # 1e-5
        name: goal_region
        add_collision: False
        body_type: kinematic
        initial_pose:
          p: [-0.15, -1.2, 0.]
      pos:
        ppos:
          p: [-0.15, -1.2, 0.]
        qpos: [0.7071, 0., 0.7071, 0.]
        randp_scale: [0.1, 0.1, 0.]
        randq_scale: [0., 0., 0., 0.]
  assets: 
    - name: table
      file_path: assets/scenes/table/table.glb
      collision:
        type: box
        pos:
          p: [0, 0, 0.45982145]
          half_size: [3.0225, 1.51125, 0.45982145]
      pos: 
        ppos:
          p: [-0.12, 0., -0.9196429]
          q: [0., 0., 1.5707963268]
        randp_scale: [0., 0., 0.]
        randq_scale: [0., 0., 0., 0.]
      scale: [4.375, 4.375, 1.75]
    
objects:
  -
    name: shoe1
    file_path: assets/objects/single_shoe_annotated/base.glb
    annotation_path: assets/objects/single_shoe_annotated/model_data.json
    material: 
      type: sapien.pysapien.physx.PhysxMaterial
      params:
        static_friction: 0.3
        dynamic_friction: 0.3
        restitution: 0.
    visual:
      filename: assets/objects/single_shoe_annotated/base.glb
      scale: [0.1, 0.1, 0.1]
    collision:
      type: convex
      filename: assets/objects/single_shoe_annotated/base.glb
      scale: [0.1, 0.1, 0.1]
    pos:
      ppos:
        p: [-0.17, 1, 0.042]
      qpos: [0.495, 0.498, 0.503, 0.505]
      randp_scale: [0.15, 0.2, 0.]
      randq_scale: [0., 0., 0., 0.]
    mass_params:
      mass: 1
      cmass_local_pose: [0., 0., 0.]
      inertia: [0.1, 0.1, 0.1]
  
  -
    name: shoe2
    file_path: release/perturbation_assets_v1/perturbation_assets_v1/distractors/041_shoe/visual/base0.glb
    annotation_path: release/perturbation_assets_v1/perturbation_assets_v1/distractors/041_shoe/model_data0.json
    material: 
      type: sapien.pysapien.physx.PhysxMaterial
      params:
        static_friction: 0.3
        dynamic_friction: 0.3
        restitution: 0.
    visual:
      filename: release/perturbation_assets_v1/perturbation_assets_v1/distractors/041_shoe/visual/base0.glb
      scale: [0.11, 0.11, 0.11]
    collision:
      type: convex
      filename: release/perturbation_assets_v1/perturbation_assets_v1/distractors/041_shoe/collision/base0.glb
      scale: [0.11, 0.11, 0.11]
    pos:
      ppos:
        p: [-0.2, 0.8, 0.042]
      qpos: [0.495, 0.498, 0.503, 0.505]
      randp_scale: [0.15, 0.2, 0.]
      randq_scale: [0., 0., 0., 0.]
    mass_params:
