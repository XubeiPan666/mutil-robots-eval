# configuration for objects and agents, add scene as well
task_name: FourArmsWeldingCube
scene:
  name: Table
  env:
    floor_width: 100
  primitives:

    - name: hollow_cube
      builder: utils.building.actors.build_hollow_cube
      params:
        half_size: 0.11
        edge_thickness: 0.01
        name: hollow_cube
        initial_pose:
          p: [0., 0., 0.13]
      pos:
        ppos:
          p: [0., 0., 0.13]
        qpos: [1., 0., 0., 0.]
        # randp_scale: [0.1, -0.1, 0.]
        randq_scale: [0., 0., 0., 0.]
        random_quaternions: [1, 1, 0]
    
    
  assets: 
    - name: table
      file_path: assets/scenes/table/table.glb
      collision:
        type: box
        pos:
          p: [0, 0, 0.45982145]
          half_size: [3.0225, 1.51125, 0.45982145]
      pos: 
        ppos:
          p: [-0.12, 0., -0.9196429]
          q: [0., 0., 1.5707963268]
        randp_scale: [0., 0., 0.]
        randq_scale: [0., 0., 0., 0.]
      scale: [4.375, 4.375, 1.75]
    
