  assets: 
    - name: table
      file_path: assets/scenes/table/table.glb
      collision:
        type: box
        pos:
          p: [0, 0, 0.45982145]
          half_size: [3.0225, 1.51125, 0.45982145]
      pos: 
        ppos:
          p: [-0.12, 0., -0.9196429]
          q: [0., 0., 1.5707963268]
        randp_scale: [0., 0., 0.]
        randq_scale: [0., 0., 0., 0.]
      scale: [4.375, 4.375, 1.75]
    
objects:
  # Object 1: Can (071_can) - cylindrical, near region_1, picked by agent0
  # Size at scale 0.05: 7.1cm x 9.6cm x 7.1cm
  - name: can1
    file_path: release/perturbation_assets_v1/perturbation_assets_v1/distractors/071_can/visual/base0.glb
    annotation_path: release/perturbation_assets_v1/perturbation_assets_v1/distractors/071_can/model_data0.json
    material: 
      type: sapien.pysapien.physx.PhysxMaterial
      params:
        static_friction: 0.5
        dynamic_friction: 0.5
        restitution: 0.
    visual:
      filename: release/perturbation_assets_v1/perturbation_assets_v1/distractors/071_can/visual/base0.glb
      scale: [0.05, 0.05, 0.05]
    collision:
      type: convex
      filename: release/perturbation_assets_v1/perturbation_assets_v1/distractors/071_can/collision/base0.glb
      scale: [0.05, 0.05, 0.05]
    pos:
      ppos:
        p: [0.01, -0.4, 0.]
      qpos: [0.5, 0.5, 0.5, 0.5]
      randp_scale: [[0.03, 0.03, 0.], [0.03, -0.03, 0.]]
      randq_scale: [0., 0., 0., 0.]
    mass_params:
      mass: 0.05
      cmass_local_pose: [0., 0., 0.]
      inertia: [0.1, 0.1, 0.1]

  # Object 2: Tea Box (112_tea-box) - rectangular box, near region_2, picked by agent1
  # Size at scale 0.04: 7.7cm x 5.8cm x 5.8cm
