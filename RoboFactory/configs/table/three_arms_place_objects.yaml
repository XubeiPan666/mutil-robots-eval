        p: [-0.01, 0., 0.]
      qpos: [0.5, 0.5, 0.5, 0.5]
      randp_scale: [[-0.03, 0.03, 0.], [-0.03, -0.03, 0.]]
      randq_scale: [0., 0., 0., 0.]
    mass_params:
      mass: 0.05
      cmass_local_pose: [0., 0., 0.]
      inertia: [0.1, 0.1, 0.1]

  # Object 3: Hamburg (006_hamburg) - flat round shape, near region_3, picked by agent2
  # Size at scale 0.035: 7.2cm x 2.5cm x 6.7cm
