cameras:
  sensor:
    - 
      uid: wrist_camera_agent0
      pose:
        type: pose
        params: [[0.2, 0, -0.18], [0.0, 0.707107, 0.0, 0.707107]]
      width: 224
      height: 224
      # fov: 1.5707963268
      fov: 2.0943951024
      near: 0.1
      far: 10
    - 
      uid: wrist_camera_agent1
      pose:
        type: pose
        params: [[0.2, 0, -0.18], [0.0, 0.707107, 0.0, 0.707107]]
      width: 224
      height: 224
      # fov: 1.5707963268
      fov: 2.0943951024
      near: 0.1
      far: 10
    - 
      uid: head_camera_global
      pose:
        type: look_at
        params: [[0.2, 0., 0.5], [0.3, 0, 0.3]]
      width: 224
      height: 224
      fov: 2.0943951024
      near: 0.1
      far: 10
  human_render:
    - 
      uid: render_camera
      pose:
        type: look_at
        params: [[0.6, 0.7, 0.6], [0.0, 0.0, 0.35]]
      width: 1024
      height: 1024
      fov: 1
      near: 0.01
      far: 100
      
