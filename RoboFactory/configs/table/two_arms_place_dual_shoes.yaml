        randp_scale: [0., 0., 0.]
        randq_scale: [0., 0., 0., 0.]
      scale: [4.375, 4.375, 1.75]
  env:
    floor_width: 100
    
objects:
  - 
    name: shoe1
    file_path: release/perturbation_assets_v1/perturbation_assets_v1/distractors/041_shoe/visual/base0.glb
    annotation_path: release/perturbation_assets_v1/perturbation_assets_v1/distractors/041_shoe/model_data0.json
    material: 
      type: sapien.pysapien.physx.PhysxMaterial
      params:
        static_friction: 0.3
        dynamic_friction: 0.3
        restitution: 0.
    visual:
      filename: release/perturbation_assets_v1/perturbation_assets_v1/distractors/041_shoe/visual/base0.glb
      scale: [0.11, 0.11, 0.11]
    collision:
      type: multiple_convex
      filename: release/perturbation_assets_v1/perturbation_assets_v1/distractors/041_shoe/collision/base0.glb
      scale: [0.11, 0.11, 0.11]
    pos:
      ppos:
        p: [0.4, -0.6, 0.]
      qpos: [0.5, 0.5, 0.5, 0.5]
      randp_scale: [0.1, 0.2, 0.]
      randq_scale: [0., 0., 0., 0.]
    # mass_params:
    #   mass: 0.005
    #   cmass_local_pose: [0., 0., 0.]
    #   inertia: [0.1, 0.1, 0.1]

  - 
    name: shoe2
    file_path: release/perturbation_assets_v1/perturbation_assets_v1/distractors/041_shoe/visual/base0.glb
    annotation_path: release/perturbation_assets_v1/perturbation_assets_v1/distractors/041_shoe/model_data0.json
    material:
      type: sapien.pysapien.physx.PhysxMaterial
      params:
        static_friction: 0.3
        dynamic_friction: 0.3
        restitution: 0.
    visual:
      filename: release/perturbation_assets_v1/perturbation_assets_v1/distractors/041_shoe/visual/base0.glb
      scale: [0.11, 0.11, 0.11]
    collision:
      type: multiple_convex
      filename: release/perturbation_assets_v1/perturbation_assets_v1/distractors/041_shoe/collision/base0.glb
      scale: [0.11, 0.11, 0.11]
    pos:
      ppos:
        p: [0.4, 0.6, 0.]
      qpos: [0.5, 0.5, 0.5, 0.5]
      randp_scale: [0.1, -0.2, 0.]
      randq_scale: [0., 0., 0., 0.]
  
  -
    name: shoebox
    file_path: release/perturbation_assets_v1/perturbation_assets_v1/distractors/007_shoe-box/visual/base0.glb
    annotation_path: release/perturbation_assets_v1/perturbation_assets_v1/distractors/007_shoe-box/model_data0.json
    material: 
      type: sapien.pysapien.physx.PhysxMaterial
      params:
        static_friction: 0.5
        dynamic_friction: 0.5
        restitution: 0.
    visual:
      filename: release/perturbation_assets_v1/perturbation_assets_v1/distractors/007_shoe-box/visual/base0.glb
      scale: [0.47, 0.43, 0.4]
    collision:
      type: multiple_convex
      filename: release/perturbation_assets_v1/perturbation_assets_v1/distractors/007_shoe-box/collision/base0.glb
      scale: [0.47, 0.43, 0.4]
    body_type: static  # Set tray as static (immovable) object
    pos:
      ppos:
        p: [0.3, 0., 0.]
      # qpos: [0.706527, 0.706483, -0.0291356, -0.0291767]  # 原始朝向
      # qpos: [0.707106781, 0.707106781, 0, 0]  # 绕X轴旋转90度
      qpos: [0.5, 0.5, 0.5, 0.5]  # 绕Z轴旋转90度（水平面内旋转）
      # randp_scale: [0.1, 0.1, 0.]
      randq_scale: [0., 0., 0., 0.]



