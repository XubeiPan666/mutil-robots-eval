# Phase Configuration for TwoArmsPlaceObjectCabinet - Sync (rule-based)
# Both agents move simultaneously: agent0 picks object while agent1 grabs handle and opens drawer.
#
# State machine:
#   Phase 1 (both move: agent0 pick object, agent1 grab+open drawer) --[both_grip + delay:5]--> Phase 2
#   Phase 2 (agent0 place object, agent1 hold drawer) --[agent0_release]--> Phase 3
#   Phase 3 (agent0 recover, agent1 hold drawer)
#
# delay:5 on both_grip: after both grip simultaneously, agent1 still needs a few steps
# to finish pulling the drawer fully open before agent0 arrives to place the object.

mode: "rule_based"
initial_phase: 1
gripper_threshold: 0.035
min_steps_per_phase: 3

phase_instructions:
  1:
    agent0: "Pick up the green box."
    agent1: "Grab the drawer handle."
  2:
    agent0: "Place the green box in the drawer."
    agent1: "Pull the drawer open."
  3:
    agent0: "Recover."
    agent1: "Wait for the other robot."

transitions:
  - from: 1
    to: 2
    condition: "both_grip"
    min_steps: 3
    delay: 5
  - from: 2
    to: 3
    condition: "agent0_release"

# Timestep-based fallback schedule
phase_schedule:
  1-6: 1
  7-11: 2
  12+: 3
