# Phase Configuration for TwoArmsPlaceObjectCabinet - In-domain (rule-based)
# Sequential: agent1 grabs drawer handle and opens it; then agent0 picks the object and places it.
#
# State machine:
#   Phase 1 (agent1 approach handle, agent0 wait) --[agent1_grip]--> Phase 2
#   Phase 2 (agent1 pull drawer, agent0 wait) --[any_grip, min_steps:6]--> Phase 3
#   Phase 3 (agent0 pick object, agent1 hold drawer) --[agent0_grip]--> Phase 4
#   Phase 4 (agent0 place object, agent1 hold drawer) --[agent0_release]--> Phase 5
#   Phase 5 (agent0 recover, agent1 hold drawer)
#
# Phase 2 uses any_grip (level-triggered): agent1 is already gripping, so the condition
# is always True; combined with min_steps:6 it acts as a timed hold — Phase 2 lasts
# exactly 6 high-level steps before automatically advancing to Phase 3.

mode: "rule_based"
initial_phase: 1
gripper_threshold: 0.035
min_steps_per_phase: 2

phase_instructions:
  1:
    agent0: "Wait for the other robot."
    agent1: "Grab the drawer handle."
  2:
    agent0: "Wait for the other robot."
    agent1: "Pull the drawer open."
  3:
    agent0: "Pick up the green box."
    agent1: "Wait for the other robot."
  4:
    agent0: "Place the green box in the drawer."
    agent1: "Wait for the other robot."
  5:
    agent0: "Recover."
    agent1: "Hold the drawer open."

transitions:
  - from: 1
    to: 2
    condition: "agent1_grip"
  - from: 2
    to: 3
    condition: "any_grip"
    min_steps: 1
  - from: 3
    to: 4
    condition: "agent0_grip"
  - from: 4
    to: 5
    condition: "agent0_release"

# Timestep-based fallback schedule
phase_schedule:
  1-2: 1
  3-5: 2
  6-9: 3
  10-13: 4
  14+: 5
