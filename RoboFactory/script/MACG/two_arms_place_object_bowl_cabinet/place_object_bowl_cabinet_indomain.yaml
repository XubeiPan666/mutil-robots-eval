# Phase Configuration for TwoArmsPlaceObjectBowlCabinet - In-domain (rule-based)
# agent1 opens the cabinet drawer; agent0 picks up the bowl and places it inside.
#
# State machine:
#   Phase 1 (agent1 approach handle, agent0 wait) --[agent1_grip]--> Phase 2
#   Phase 2 (agent1 pull drawer open, agent0 wait) --[any_grip, min_steps:1]--> Phase 3
#   Phase 3 (agent0 pick bowl, agent1 hold drawer) --[agent0_grip]--> Phase 4
#   Phase 4 (agent0 place bowl in drawer, agent1 hold drawer) --[agent0_release]--> Phase 5
#   Phase 5 (agent0 recover, agent1 hold drawer)

mode: "rule_based"
initial_phase: 1
gripper_threshold: 0.035
min_steps_per_phase: 2

phase_instructions:
  1:
    agent0: "Wait for the other robot."
    agent1: "Grab the drawer handle."
  2:
    agent0: "Wait for the other robot."
    agent1: "Pull the drawer open."
  3:
    agent0: "Pick up the bowl."
    agent1: "Hold the drawer open."
  4:
    agent0: "Place the bowl in the drawer."
    agent1: "Hold the drawer open."
  5:
    agent0: "Recover."
    agent1: "Hold the drawer open."

transitions:
  - from: 1
    to: 2
    condition: "agent1_grip"
  - from: 2
    to: 3
    condition: "any_grip"
    min_steps: 1
  - from: 3
    to: 4
    condition: "agent0_grip"
  - from: 4
    to: 5
    condition: "agent0_release"

# Timestep-based fallback schedule
phase_schedule:
  1-2: 1
  3-5: 2
  6-9: 3
  10-13: 4
  14+: 5
