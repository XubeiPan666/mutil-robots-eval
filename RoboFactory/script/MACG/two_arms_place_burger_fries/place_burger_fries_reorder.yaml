# Phase Configuration for TwoArmsPlaceBurgerFries - Reorder (rule-based)
# Reversed: agent1 picks/places fries first, then agent0 picks/places burger
#
# State machine:
#   Phase 1 (agent1 pick fries) --[agent1_grip]--> Phase 2 (agent1 place fries)
#   Phase 2 --[agent1_release]--> Phase 3 (agent0 pick burger)
#   Phase 3 --[agent0_grip]--> Phase 4 (agent0 place burger)
#   Phase 4 --[agent0_release]--> Phase 5 (recover)

mode: "rule_based"
initial_phase: 1
gripper_threshold: 0.035
min_steps_per_phase: 2

phase_instructions:
  1:
    agent0: "Wait for the other robot."
    agent1: "Pick up the fries."
  2:
    agent0: "Wait for the other robot."
    agent1: "Place the fries on the plate on the right."
  3:
    agent0: "Pick up the burger."
    agent1: "Recover."
  4:
    agent0: "Place the burger on the plate on the left."
    agent1: "Wait for the other robot."
  5:
    agent0: "Recover."
    agent1: "Wait for the other robot."

transitions:
  - from: 1
    to: 2
    condition: "agent1_grip"
  - from: 2
    to: 3
    condition: "agent1_release"
  - from: 3
    to: 4
    condition: "agent0_grip"
  - from: 4
    to: 5
    condition: "agent0_release"

# Timestep-based fallback schedule
phase_schedule:
  1-2: 1
  3-6: 2
  7-9: 3
  10-13: 4
  14+: 5
