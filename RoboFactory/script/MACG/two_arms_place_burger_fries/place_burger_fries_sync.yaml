# Phase Configuration for TwoArmsPlaceBurgerFries - Sync (rule-based)
# Both agents pick simultaneously, then agent0 places burger first, then agent1 places fries
#
# State machine:
#   Phase 1 (both pick) --[both_grip]--> Phase 2 (agent0 place burger)
#   Phase 2 --[agent0_release + delay 1]--> Phase 3 (agent1 place fries)
#   Phase 3 --[agent1_release]--> Phase 4 (recover)

mode: "rule_based"
initial_phase: 1
gripper_threshold: 0.035
min_steps_per_phase: 2

phase_instructions:
  1:
    agent0: "Pick up the burger."
    agent1: "Pick up the fries."
  2:
    agent0: "Place the burger on the plate on the left."
    agent1: "Wait for the other robot."
  3:
    agent0: "Recover."
    agent1: "Place the fries on the plate on the right."
  4:
    agent0: "Wait for the other robot."
    agent1: "Recover."

transitions:
  - from: 1
    to: 2
    condition: "both_grip"
  - from: 2
    to: 3
    condition: "agent0_release"
  - from: 3
    to: 4
    condition: "agent1_release"

# Timestep-based fallback schedule
phase_schedule:
  1-3: 1
  4-7: 2
  8+: 3
