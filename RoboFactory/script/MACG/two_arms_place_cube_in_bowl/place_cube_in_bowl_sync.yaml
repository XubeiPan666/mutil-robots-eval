# Phase Configuration for TwoArmsCubeInBowl - In-domain (rule-based)
# Sequential: agent1 (right) picks/places bowl first, then agent0 (left) picks/places cube
#
# State machine:
#   Phase 1 (agent1 pick bowl) --[agent1_grip]--> Phase 2 (agent1 place bowl on tray)
#   Phase 2 --[agent1_release]--> Phase 3 (agent0 pick cube)
#   Phase 3 --[agent0_grip]--> Phase 4 (agent0 place cube in bowl)
#   Phase 4 --[agent0_release]--> Phase 5 (recover)

mode: "rule_based"
initial_phase: 1
gripper_threshold: 0.02
min_steps_per_phase: 2

phase_instructions:
  1:
    agent0: "Pick up the cube."
    agent1: "Pick up the bowl."
  2:
    agent0: "Wait for the other robot."
    agent1: "Place the bowl on the tray in the center."
  3:
    agent0: "Place the cube inside the bowl."
    agent1: "Recover."
  4:
    agent0: "Recover."
    agent1: "Wait for the other robot."

transitions:
  - from: 1
    to: 2
    condition: "agent1_grip"
  - from: 2
    to: 3
    condition: "agent1_release"
  - from: 3
    to: 4
    condition: "agent0_release"
# Timestep-based fallback schedule
phase_schedule:
  1-2: 1
  3-6: 2
  6-8: 3
  8-11: 4
  11+: 5
