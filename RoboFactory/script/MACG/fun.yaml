# Phase Configuration Example
# This file defines phase instructions and phase schedule for multi-agent evaluation

# Define instructions for each phase
# Each phase can have different instructions for each agent
phase_instructions:
  1:
    agent0: "Pick up the bottle"
    agent1: "Pick up the box."
    agent2: "Pick up the food."
  2:
    agent0: "Place the bottle on the target."
    agent1: "Wait for the other robots."
    agent2: "Wait for the other robots."
  3:
    agent0: "Wait for the other robots."
    agent1: "Place the box on the target."
    agent2: "Wait for the other robots."
  4:
    agent0: "Wait for the other robots."
    agent1: "Wait for the other robots."
    agent2: "Place the food on the target."

# Define phase schedule
# Format options:
# 1. String format: "1:1,2:2,3-5:3,6-8:4,9+:5"
# 2. Dictionary format (as shown below):
phase_schedule:
  1-3: 1        # Step 1 uses phase 1
  3-6: 2        # Step 2 uses phase 2
  6-9: 3        # Step 3 uses phase 3
  9-12: 4        # Step 4 uses phase 4
  12+: 4      # Step 5 uses phase 5
  # 12-15: 5        # Step 5 uses phase 5
  # 15+: 6        # Step 6 uses phase 6
# Alternative string format (uncomment to use):
# phase_schedule: "1:1,2:2,3-5:3,6-8:4,9+:5"



