# Phase Configuration for TwoArmsStackCube - Sync Reorder (rule-based)
# Both agents pick simultaneously, then agent1 places first, then agent0 stacks
#
# State machine:
#   Phase 1 (both pick) --[both_grip]--> Phase 2 (agent1 place)
#   Phase 2 --[agent1_release]--> Phase 3 (agent0 stack)
#   Phase 3 --[agent0_release]--> Phase 4 (recover)

mode: "rule_based"
initial_phase: 1
gripper_threshold: 0.02
min_steps_per_phase: 2

phase_instructions:
  1:
    agent0: "Pick up the blue cube."
    agent1: "Pick up the green cube."
  2:
    agent0: "Wait for the other robot."
    agent1: "Place the green cube on the target."
  3:
    agent0: "Place the blue cube on the target."
    agent1: "Wait for the other robot."
  4:
    agent0: "Recover."
    agent1: "Wait for the other robot."

transitions:
  - from: 1
    to: 2
    condition: "both_grip"
  - from: 2
    to: 3
    condition: "agent1_release"
    delay: 2
  - from: 3
    to: 4
    condition: "agent0_release"

# Timestep-based fallback schedule
phase_schedule:
  1-3: 1
  3-6: 2
  6+: 3
