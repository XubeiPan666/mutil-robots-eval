# Phase Configuration for ThreeArmsPlaceObjects - Composite (rule-based)
# Sequential: agent0 picks can1, then agent1 picks burger and box one at a time.
# Agent2 only waits throughout (no gripping). All objects are placed into the tray.
#
# State machine (7 phases):
#   Phase 1 (a0 approach can1)   --[agent0_grip]-->                Phase 2 (a0 carry & place can1)
#   Phase 2                      --[agent0_release]-->             Phase 3 (a1 approach burger)
#   Phase 3                      --[agent1_grip]-->                Phase 4 (a1 carry & place burger)
#   Phase 4                      --[agent1_release]-->             Phase 5 (a1 recover)
#   Phase 5                      --[all_release, min_steps:2]-->   Phase 6 (a1 approach box)
#   Phase 6                      --[agent1_grip]-->                Phase 7 (a1 carry & place box)
#
# Phase 5 uses all_release (level-triggered): after Phase 4 all grippers are open,
# so the condition is always True; combined with min_steps:2 it acts as a timed hold —
# Phase 5 lasts exactly 2 high-level steps before automatically advancing to Phase 6.

mode: "rule_based"
initial_phase: 1
gripper_threshold: 0.032
min_steps_per_phase: 1

phase_instructions:
  1:
    agent0: "Pick up the can."
    agent1: "Pick up the burger."
    agent2: "Wait for the other robots."
  2:
    agent0: "Place the can on the target."
    agent1: "Wait for the other robots."
    agent2: "Wait for the other robots."
  3:
    agent0: "Recover."
    agent1: "Place the burger on the target."
    agent2: "Wait for the other robots."
  4:
    agent0: "Wait for the other robots."
    agent1: "Recover."
    agent2: "Wait for the other robots."
  5:
    agent0: "Wait for the other robots."
    agent1: "Pick up the box."
    agent2: "Wait for the other robots."
  6:
    agent0: "Wait for the other robots."
    agent1: "Place the box on the target."
    agent2: "Wait for the other robots."

transitions:
  - from: 1
    to: 2
    condition: "a01_grip"         # a0 grasps can1 AND a1 grasps burger (a2 ignored)
  - from: 2
    to: 3
    condition: "agent0_release"   # a0 releases can1 into tray
  - from: 3
    to: 4
    condition: "agent1_release"      # a1 releases burger into tray
  - from: 4
    to: 5
    condition: "all_release"      # timed hold: all grippers open after Phase 4
    min_steps: 2   # a1 releases teabox2 into tray
  - from: 5
    to: 6
    condition: "agent1_grip"      # a1 grasps the box
             # advance after 2 high-level steps of recovery

# Timestep-based fallback schedule
phase_schedule:
  1-5: 1
  5-12: 2
  12-18: 3
  18-25: 4
  25-27: 5
  27-34: 6
  34+: 7
