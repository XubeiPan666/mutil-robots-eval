# Phase Configuration for ThreeArmsPlaceObjects - In-domain (rule-based)
# Sequential: agent0 picks can1, agent1 picks teabox2, agent2 picks hamburg3.
# All objects are placed into the tray one at a time.
#
# State machine (7 phases, purely gripper-triggered):
#   Phase 1 (a0 approach can1)  --[agent0_grip]-->    Phase 2 (a0 carry & place can1)
#   Phase 2                     --[agent0_release]--> Phase 3 (a1 approach teabox2)
#   Phase 3                     --[agent1_grip]-->    Phase 4 (a1 carry & place teabox2)
#   Phase 4                     --[agent1_release]--> Phase 5 (a2 approach hamburg3)
#   Phase 5                     --[agent2_grip]-->    Phase 6 (a2 carry & place hamburg3)
#   Phase 6                     --[agent2_release]--> Phase 7 (done)

mode: "rule_based"
initial_phase: 1
gripper_threshold: 0.032
min_steps_per_phase: 1

phase_instructions:
  3:
    agent0: "Pick up the can."
    agent1: "Recover."
    agent2: "Wait for the other robots."
  4:
    agent0: "Place the can on the target."
    agent1: "Wait for the other robots."
    agent2: "Wait for the other robots."
  1:
    agent0: "Wait for the other robots."
    agent1: "Pick up the box."
    agent2: "Wait for the other robots."
  2:
    agent0: "Wait for the other robots."
    agent1: "Place the box on the target."
    agent2: "Wait for the other robots."
  5:
    agent0: "Wait for the other robots."
    agent1: "Recover."
    agent2: "Pick up the burger."
  6:
    agent0: "Wait for the other robots."
    agent1: "Wait for the other robots."
    agent2: "Place the burger on the target."
  7:
    agent0: "Wait for the other robots."
    agent1: "Wait for the other robots."
    agent2: "Recover."

transitions:
  - from: 1
    to: 2
    condition: "agent1_grip"      # a0 grasps can1
  - from: 2
    to: 3
    condition: "agent1_release"   # a0 releases can1 into tray
  - from: 3
    to: 4
    condition: "agent0_grip"      # a1 grasps teabox2
  - from: 4
    to: 5
    condition: "agent0_release"   # a1 releases teabox2 into tray
  - from: 5
    to: 6
    condition: "agent2_grip"      # a2 grasps hamburg3
  - from: 6
    to: 7
    condition: "agent2_release"   # a2 releases hamburg3 into tray

# Timestep-based fallback schedule
phase_schedule:
  1-5: 1
  5-12: 2
  12-18: 3
  18-25: 4
  25-32: 5
  32-40: 6
  40+: 7
