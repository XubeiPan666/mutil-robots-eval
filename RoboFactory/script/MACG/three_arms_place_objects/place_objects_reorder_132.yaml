# Phase Configuration for ThreeArmsPlaceObjects - Reorder 132 (rule-based)
# Use with status="three_arms_place_objects_123_132"
# Object mapping: agent0->can1 (obj1), agent1->hamburg3 (obj3), agent2->teabox2 (obj2)
# Execution order remains agent0 -> agent1 -> agent2.
#
# State machine (7 phases, purely gripper-triggered):
#   Phase 1 (a0 approach can1)     --[agent0_grip]-->    Phase 2 (a0 carry & place can1)
#   Phase 2                        --[agent0_release]--> Phase 3 (a1 approach hamburg3)
#   Phase 3                        --[agent1_grip]-->    Phase 4 (a1 carry & place hamburg3)
#   Phase 4                        --[agent1_release]--> Phase 5 (a2 approach teabox2)
#   Phase 5                        --[agent2_grip]-->    Phase 6 (a2 carry & place teabox2)
#   Phase 6                        --[agent2_release]--> Phase 7 (done)

mode: "rule_based"
initial_phase: 1
gripper_threshold: 0.032
min_steps_per_phase: 1

phase_instructions:
  1:
    agent0: "Pick up the can."
    agent1: "Wait for the other robots."
    agent2: "Wait for the other robots."
  2:
    agent0: "Place the can in the tray."
    agent1: "Wait for the other robots."
    agent2: "Wait for the other robots."
  3:
    agent0: "Recover."
    agent1: "Pick up the hamburger."
    agent2: "Wait for the other robots."
  4:
    agent0: "Wait for the other robots."
    agent1: "Place the hamburger in the tray."
    agent2: "Wait for the other robots."
  5:
    agent0: "Wait for the other robots."
    agent1: "Recover."
    agent2: "Pick up the tea box."
  6:
    agent0: "Wait for the other robots."
    agent1: "Wait for the other robots."
    agent2: "Place the tea box in the tray."
  7:
    agent0: "Wait for the other robots."
    agent1: "Wait for the other robots."
    agent2: "Recover."

transitions:
  - from: 1
    to: 2
    condition: "agent0_grip"      # a0 grasps can1
  - from: 2
    to: 3
    condition: "agent0_release"   # a0 releases can1 into tray
  - from: 3
    to: 4
    condition: "agent1_grip"      # a1 grasps hamburg3
  - from: 4
    to: 5
    condition: "agent1_release"   # a1 releases hamburg3 into tray
  - from: 5
    to: 6
    condition: "agent2_grip"      # a2 grasps teabox2
  - from: 6
    to: 7
    condition: "agent2_release"   # a2 releases teabox2 into tray

# Timestep-based fallback schedule
phase_schedule:
  1-5: 1
  5-12: 2
  12-18: 3
  18-25: 4
  25-32: 5
  32-40: 6
  40+: 7
