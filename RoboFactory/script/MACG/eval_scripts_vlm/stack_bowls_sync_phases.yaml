# Synchronous stack-bowl instructions. Instruction text matches training data.
mode: "vlm"
initial_phase: 1
gripper_threshold: 0.02
min_steps_per_phase: 2

task_brief: >-
  Both agents pick their own bowl simultaneously. Agent0 places its bowl
  first on the left plate/tray while agent1 waits holding its bowl. Agent1
  then stacks its bowl on the first bowl at the right and recovers.

phase_semantics:
  1: >-
    Both agents approach and grasp their bowls simultaneously. Stay until
    both grippers are closed and both bowls are visibly held.
  2: >-
    Agent0 carries and places its bowl on the left plate/tray while agent1
    waits holding its bowl. Advance only after agent0 releases its supported
    bowl by opening the gripper.
  3: >-
    Agent0 recovers while agent1 carries its bowl to the right and stacks it
    on agent0's bowl. Advance only after the upper bowl is supported and
    agent1 opens its gripper.
  4: >-
    Agent1 recovers while agent0 waits. This is the terminal instruction
    phase.

atomic_actions:
  - "Pick up the bowl."
  - "Place the bowl on the plate on the left."
  - "Place the bowl on the plate on the right."
  - "Wait for the other robots."
  - "Recover."

phase_instructions:
  1:
    agent0: "Pick up the bowl."
    agent1: "Pick up the bowl."
  2:
    agent0: "Place the bowl on the plate on the left."
    agent1: "Wait for the other robots."
  3:
    agent0: "Recover."
    agent1: "Place the bowl on the plate on the right."
  4:
    agent0: "Wait for the other robots."
    agent1: "Recover."

# Rule detector runs only in shadow mode for agreement metrics.
transitions:
  - from: 1
    to: 2
    condition: "both_grip"
  - from: 2
    to: 3
    condition: "agent0_release"
    delay: 1
  - from: 3
    to: 4
    condition: "agent1_release"

vlm:
  model: "qwen/qwen3.5-27b"
  camera: "head_camera_vlm"
  every_k: 1
  max_retries: 2
  request_timeout_s: 60
  max_total_wait_s: 90
  min_confidence: 0.6
  image_upscale: 2
