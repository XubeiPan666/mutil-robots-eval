# Phase Configuration for TwoArmsPlaceCanBasket - In-domain (rule-based)
# Sequential: agent1 grabs basket first and holds, then agent0 grabs can and places it
#
# State machine:
#   Phase 1 (agent1 pick basket) --[agent1_grip]--> Phase 2 (agent0 pick can)
#   Phase 2 --[agent0_grip]--> Phase 3 (agent0 place can into basket)
#   Phase 3 --[agent0_release]--> Phase 4 (agent0 recover)

mode: "rule_based"
initial_phase: 1
gripper_threshold: 0.03
min_steps_per_phase: 2

phase_instructions:
  1:
    agent0: "Wait for the other robot."
    agent1: "Pick up the basket."
  2:
    agent0: "Pick up the can."
    agent1: "Hold the basket in position."
  3:
    agent0: "Place the can into the basket."
    agent1: "Hold the basket in position."
  4:
    agent0: "Recover."
    agent1: "Hold the basket in position."

transitions:
  - from: 1
    to: 2
    condition: "agent1_grip"
  - from: 2
    to: 3
    condition: "agent0_grip"
  - from: 3
    to: 4
    condition: "agent0_release"

# Timestep-based fallback schedule
phase_schedule:
  1-3: 1
  4-7: 2
  8-11: 3
  12+: 4
