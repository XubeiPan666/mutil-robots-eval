# Phase Configuration for TwoArmsPushCube - Sync (tcp_rule)
# Both agents approach and push simultaneously
#
# State machine:
#   Phase 1 (both approach) --[both_tcp_low]--> Phase 2 (both push)

mode: "tcp_rule"
initial_phase: 1
z_threshold: 0.05
z_tcp_high: 0.03
min_steps_per_phase: 2

phase_instructions:
  1:
    agent0: "Move to the blue cube."
    agent1: "Move to the green cube."
  2:
    agent0: "Push the blue cube to the target."
    agent1: "Push the green cube to the target."

transitions:
  - from: 1
    to: 2
    condition: "both_tcp_low"

# Timestep-based fallback schedule
phase_schedule:
  1-3: 1
  3+: 2
