# Phase Configuration for TwoArmsStackBowl - Sync (rule-based)
# Each agent picks independently. The first agent to close its gripper waits
# for the other agent, then agent0 places first and agent1 places second.
#
# State machine:
#   Phase 1 (both pick) --[agent0_closed]--> Phase 2 (agent0 ready, agent1 pick)
#                       --[agent1_closed]--> Phase 3 (agent0 pick, agent1 ready)
#                       --[both_grip]----> Phase 4 (agent0 place)
#   Phase 2 --[agent1_closed]--> Phase 4
#   Phase 3 --[agent0_closed]--> Phase 4
#   Phase 4 --[agent0_release]--> Phase 5 (agent1 place)
#   Phase 5 --[agent1_release]--> Phase 6 (recover)

mode: "rule_based"
initial_phase: 1
gripper_threshold: 0.02
min_steps_per_phase: 2

phase_instructions:
  1:
    agent0: "Pick up the bowl."
    agent1: "Pick up the bowl."
  2:
    agent0: "Wait for the other robot."
    agent1: "Pick up the bowl."
  3:
    agent0: "Pick up the bowl."
    agent1: "Wait for the other robot."
  4:
    agent0: "Place the bowl on the plate on the left."
    agent1: "Wait for the other robot."
  5:
    agent0: "Recover."
    agent1: "Place the bowl on the plate on the right."
  6:
    agent0: "Wait for the other robots."
    agent1: "Recover."

transitions:
  - from: 1
    to: 4
    condition: "both_grip"
  - from: 1
    to: 2
    condition: "agent0_closed"
  - from: 1
    to: 3
    condition: "agent1_closed"
  - from: 2
    to: 4
    condition: "agent1_closed"
  - from: 3
    to: 4
    condition: "agent0_closed"
  - from: 4
    to: 5
    condition: "agent0_release"
    delay: 1
  - from: 5
    to: 6
    condition: "agent1_release"

# Timestep-based fallback schedule
phase_schedule:
  1-3: 1
  4-6: 4
  7+: 5
