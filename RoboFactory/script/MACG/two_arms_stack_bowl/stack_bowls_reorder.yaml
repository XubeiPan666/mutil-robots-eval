# Phase Configuration for TwoArmsStackBowl - Reorder (rule-based)
# Reversed: agent1 pick/place first, then agent0 pick/place
#
# State machine:
#   Phase 1 (agent1 pick) --[agent1_grip]--> Phase 2 (agent1 place)
#   Phase 2 --[agent1_release]--> Phase 3 (agent0 pick)
#   Phase 3 --[agent0_grip]--> Phase 4 (agent0 place)
#   Phase 4 --[agent0_release]--> Phase 5 (recover)

mode: "rule_based"
initial_phase: 1
gripper_threshold: 0.02
min_steps_per_phase: 2

phase_instructions:
  1:
    agent0: "Wait for the other robots."
    agent1: "Pick up the bowl."
  2:
    agent0: "Wait for the other robots."
    agent1: "Place the bowl on the plate on the right."
  3:
    agent0: "Pick up the bowl."
    agent1: "Recover."
  4:
    agent0: "Place the bowl on the plate on the left."
    agent1: "Wait for the other robots."
  5:
    agent0: "Recover."
    agent1: "Wait for the other robots."

transitions:
  - from: 1
    to: 2
    condition: "agent1_grip"
  - from: 2
    to: 3
    condition: "agent1_release"
  - from: 3
    to: 4
    condition: "agent0_grip"
  - from: 4
    to: 5
    condition: "agent0_release"

# Timestep-based fallback schedule
phase_schedule:
  1-3: 1
  3-7: 2
  7-10: 3
  10+: 4
